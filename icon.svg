<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fdf0f3"/>
    </linearGradient>
    <!-- Farbverlauf wie auf der Packung: rosa oben, pfirsich in der Mitte, limettengrün unten -->
    <linearGradient id="ring" x1="0.3" y1="0.05" x2="0.7" y2="0.95">
      <stop offset="0" stop-color="#f797ad"/>
      <stop offset="0.48" stop-color="#f7c3a4"/>
      <stop offset="1" stop-color="#bfe96a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#ffd3df" stop-opacity=".0"/>
      <stop offset="0.62" stop-color="#ffc9d8" stop-opacity=".55"/>
      <stop offset="0.8" stop-color="#e6f7c4" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Schatten unten im Ring für Plastizität -->
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7a3a52" stop-opacity=".14"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#d6628a" flood-opacity=".28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="520" r="400" fill="url(#glow)"/>
  <g filter="url(#drop)">
    <circle cx="512" cy="512" r="286" fill="none" stroke="url(#ring)" stroke-width="150"/>
  </g>
  <circle cx="512" cy="512" r="286" fill="none" stroke="url(#shade)" stroke-width="150"/>
  <!-- Glanzlicht oben links -->
  <circle cx="512" cy="512" r="318" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="28"
          stroke-linecap="round" stroke-dasharray="330 2000" transform="rotate(-160 512 512)" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="250" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="160 2000" transform="rotate(20 512 512)" filter="url(#soft)"/>
</svg>
