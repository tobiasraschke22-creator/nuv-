# Optional: App als Container (Synology Container Manager → Projekt → Neu erstellen).
# Voraussetzung: vorher deploy/install.sh ausgeführt, damit die Dateien im Ordner liegen.
services:
  ringtagebuch:
    image: nginx:alpine
    container_name: ringtagebuch
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /volume1/web/ringtagebuch:/usr/share/nginx/html:ro
